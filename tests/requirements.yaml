# Feature-coverage traceability.
#
# Every requirement below maps a stable requirement ID (specification sections
# 1-18) to the automated tests that cover it.  `make ci` (and the requirements
# check in CI) fails when a requirement marked `implemented` has no mapped test,
# when a mapped test is missing or skipped, or when migrations do not apply.
#
# status values:
#   implemented  - implemented and covered by the listed tests
#   partial      - implemented for the supported subset; gaps are listed
#   external     - requires an external, legally gated step (see section 14)

version: 1
runner:
  unit: backend/tests
  component: frontend/src/**/*.test.tsx
  e2e: frontend/e2e

