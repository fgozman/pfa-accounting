apiVersion: 1

# Logs (Loki), traces (Tempo) and metrics (Prometheus), linked both ways:
# log line -> trace (trace_id), trace -> its log lines and metrics,
# metric exemplar -> trace.
datasources:
  - name: Loki
    uid: pfa-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 5000
      derivedFields:
        # trace_id is attached to each line as structured metadata by Alloy
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: pfa-tempo
          url: "${__value.raw}"
          urlDisplayLabel: View trace

  - name: Tempo
    uid: pfa-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      streamingEnabled:
        search: true
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: pfa-prometheus
      tracesToLogsV2:
        datasourceUid: pfa-loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        customQuery: true
        query: '{service_name=~".+"} | trace_id="${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: pfa-prometheus
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        queries:
          - name: Request rate of this route
            query: 'sum(rate(http_server_request_duration_seconds_count{http_route="${__span.tags["http.route"]}"}[5m]))'

  - name: Prometheus
    uid: pfa-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: pfa-tempo
