# Loki, single binary, filesystem storage: local evaluation of the PFA log
# pipeline.  Production runs Loki with object storage (S3/GCS/Azure) via the
# official Helm chart, or uses Grafana Cloud; the labels and queries are the same.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # audit-relevant logs are kept 90 days here; set this to your legal retention
  retention_period: 2160h
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
