# Tempo 3, monolithic mode, local storage: local evaluation of PFA traces.
# Production: object storage (S3/GCS/Azure) and the Helm chart, or Grafana Cloud.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"

# span metrics and the service graph, written to Prometheus (with exemplars)
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

backend_worker:
  compaction:
    block_retention: 336h

overrides:
  defaults:
    metrics_generator:
      processors: ["service-graphs", "span-metrics"]

usage_report:
  reporting_enabled: false
