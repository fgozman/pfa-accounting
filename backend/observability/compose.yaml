# Local observability for PFA: Alloy (collector) -> Loki (logs), Tempo (traces),
# Prometheus (metrics) -> Grafana (UI, provisioned dashboard and cross-links).
#
#   make observability-up       # http://127.0.0.1:3000  (admin / admin, local only)
#   make dev-json-logs          # dev stack: JSON logs into .run/dev.log + OTLP to Alloy
#   make observability-down     # stop; `docker compose ... down -v` also drops data
#
# Evaluation/development only: the same Alloy processing, labels and dashboard are
# meant for production, where the stores use object storage and Alloy collects
# container stdout (alloy/production-docker.alloy).  Everything binds to 127.0.0.1.
name: pfa-observability

services:
  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      # Alloy's own UI: pipeline graph and per-component health
      - "127.0.0.1:12345:12345"
      # OTLP from the PFA processes (gRPC / HTTP)
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./alloy/local.alloy:/etc/alloy/config.alloy:ro
      - ../.run:/var/log/pfa:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
      - tempo
      - prometheus
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ["-target=all", "-config.file=/etc/tempo/config.yaml"]
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    depends_on:
      - prometheus
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/pfa-audit.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - tempo
      - prometheus
    restart: unless-stopped

volumes:
  loki-data:
    name: pfa-observability-loki
  alloy-data:
    name: pfa-observability-alloy
  tempo-data:
    name: pfa-observability-tempo
  prometheus-data:
    name: pfa-observability-prometheus
  grafana-data:
    name: pfa-observability-grafana
