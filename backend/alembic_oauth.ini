# Alembic configuration of the OAuth 2.0 authorization server's own database
# (PFA_OAUTH_MIGRATION_DATABASE_URL).  Independent of alembic.ini (application).
[alembic]
script_location = %(here)s/migrations_oauth
prepend_sys_path = %(here)s
version_path_separator = os
# Migration DDL is applied by the OWNER role; the API/worker runtime role has no
# DDL rights at all.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
