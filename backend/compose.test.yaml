# Isolated test Compose project.
#
#   docker compose -f compose.test.yaml -p pfa-accounting-test up -d --wait
#
# - separate project name, database, volume and port
# - no access to the development volume
# - disposable: `-v` on down removes only this project's volume
name: pfa-accounting-test

services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    container_name: pfa-postgres-test
    restart: "no"
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-pfa_test}
      POSTGRES_USER: ${TEST_POSTGRES_OWNER_USER:-pfa_test_owner}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_OWNER_PASSWORD:-test_owner_password}
      POSTGRES_APP_USER: ${TEST_POSTGRES_APP_USER:-pfa_test_app}
      POSTGRES_APP_PASSWORD: ${TEST_POSTGRES_APP_PASSWORD:-test_app_password}
      POSTGRES_OAUTH_DB: ${TEST_POSTGRES_OAUTH_DB:-pfa_oauth_test}
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-5433}:5432"
    volumes:
      - pfa-pgdata-test:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  pfa-pgdata-test:
    name: pfa-pgdata-test
